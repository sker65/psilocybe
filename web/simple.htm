<!DOCTYPE html>
<html>

<head>

  <title>Psilocybe - Simple</title>
  <script src="js/embed.js"></script>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="images/atom196.png">
</head>

<body>

  <nav class="navbar navbar-default navbar-static-top" role="banner">
    <div class="container">
      <div class="navbar-header">
        <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar-collapse-1"
          aria-expanded="false">
          <span class="sr-only">Toggle navigation</span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
        </button>
        <a class="navbar-brand" href="/">Psilocybe</a>
      </div>
      <div class="collapse navbar-collapse" id="navbar-collapse-1">
        <ul class="nav navbar-nav">

          <li><a href="/config.htm">Config</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div id="container" class="container">

    <div class="power-buttons btn-group" role="group">
      <button type="button" class="btn btn-default btn-lg" id="btnOn">On</button>
      <button type="button" class="btn btn-default btn-lg" id="btnOff">Off</button>
    </div>

    <div id="patternGrid" class="grid-pattern"></div>

    <div id="colorButtonsRow" class="grid-color"></div>

  </div>

  <div id="templates" style="display: none">
    <div id="colorButtonTemplate" class="grid-item-color"></div>
    <button id="patternButtonTemplate" type="button" class="grid-item-pattern btn btn-default"></button>
  </div>

  <div class="statusbar">
    <a href="" aria-label="Refresh" title="Refresh"><span class="glyphicon glyphicon-refresh"></span></a>
    <span id="status">Loading, please wait...</span>

  <script src="js/jquery-3.1.1.min.js"></script>
