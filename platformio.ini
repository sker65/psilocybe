; PlatformIO project for the Psilocybe lamp (Wemos D1 mini, ESP8266, 4 MB flash)
; Keeps the Arduino-IDE layout: sources live in the project root.

[platformio]
src_dir = .
data_dir = data
default_envs = d1_mini

[env]
platform = espressif8266@^4.2.1
board = d1_mini
framework = arduino
; only compile the sketch files in the project root (not .pio/, data/, ...)
build_src_filter = -<*> +<*.ino> +<*.cpp>
; same layout as Arduino IDE default for D1 mini: 4MB (FS:2MB OTA:~1019KB)
board_build.ldscript = eagle.flash.4m2m.ld
board_build.filesystem = spiffs
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    fastled/FastLED@3.6.0
    links2004/WebSockets@^2.6.1
    tzapu/WiFiManager@^2.0.17
    knolleary/PubSubClient@^2.8

; flash via USB
[env:d1_mini]

; flash via OTA (ArduinoOTA, port 8266): pio run -e d1_mini_ota -t upload
[env:d1_mini_ota]
upload_protocol = espota
upload_port = Psilocybe-dd5c61.local
