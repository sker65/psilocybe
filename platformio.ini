; PlatformIO project for the Psilocybe lamp (Wemos D1 mini, ESP8266, 4 MB flash)
;
; Sources live in the project root. The web UI in web/ is embedded into the
; firmware by tools/embed_web.py at build time - there is no filesystem image,
; one upload updates firmware and UI together.

[platformio]
src_dir = .
default_envs = d1_mini

[env]
platform = espressif8266@^4.2.1
board = d1_mini
framework = arduino
; only compile the sketch files in the project root (not .pio/, web/, ...)
build_src_filter = -<*> +<*.ino> +<*.cpp>
extra_scripts = pre:tools/embed_web.py
; 4MB layout with max. ~1MB sketch so OTA always fits. The 2MB FS area is unused
; (kept so the layout matches what is already on the device).
board_build.ldscript = eagle.flash.4m2m.ld
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    fastled/FastLED@3.6.0
    links2004/WebSockets@^2.6.1
    tzapu/WiFiManager@^2.0.17
    knolleary/PubSubClient@^2.8

; flash via USB
[env:d1_mini]

; flash via OTA (ArduinoOTA, port 8266): pio run -e d1_mini_ota -t upload
[env:d1_mini_ota]
upload_protocol = espota
upload_port = Psilocybe-dd5c61.local
